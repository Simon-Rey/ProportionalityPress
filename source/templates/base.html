<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>{{ config.site_name }} – {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ config.static_url }}css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Ancizar+Serif:ital,wght@0,300..900;1,300..900&family=Anton&family=Germania+One&family=Gloock&family=IM+Fell+English+SC&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Ancizar+Serif:ital,wght@0,300..900;1,300..900&family=Anton&family=Germania+One&family=Gloock&family=IM+Fell+English+SC&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet">
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="body-content-wrap">
    <header>
      <div id="logo-wrap">
        <a href="index.html">
          <div class="logo proportionality-press">
            <span class="logo-main">Proportionality</span>
            <span class="logo-sub">Press</span>
          </div>
        </a>
      </div>
      <nav id="main-nav">
        {% for category, articles in articles_per_category %}
          <div class="submenu-wrap">
            <span class="submenu-header">{{ category }}</span>
            <div class="submenu-entry-wrap">
              {% for article in articles %}
                <a href="{{ article.link }}">
                  <div class="menu-entry">
                    <span>{{ article.title }}</span>
                  </div>
                </a>
              {% endfor %}
            </div>
          </div>
        {% endfor %}
      </nav>
    </header>

    <div id="below-header-wrap">
      <div id="content-wrap">
        <main>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <footer>Simon Rey 2025</footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.body.classList.add("is-touch");

        document.querySelectorAll('.submenu-header').forEach(header => {
          header.addEventListener('click', function (e) {
            const wrap = this.closest('.submenu-wrap');
            // Toggle only this one open, close others
            document.querySelectorAll('.submenu-wrap').forEach(w => {
              if (w !== wrap) w.classList.remove('open');
            });
            wrap.classList.toggle('open');
          });
        });
      }
    });
  </script>
</body>
</html>
