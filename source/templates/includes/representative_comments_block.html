<div class="representative-comments-block">
  <h3 class="representative-comments-block-title">{{ title }}</h3>
  <h3 class="representative-comments-block-title alternative-representative-comments-block-title hidden">{{ alt_title }}</h3>
  <div class="rule-selection-wrap">
    <div class="rule-select-header comment-analysis-measure-header">Selection Method <span class="open-explanation" data-target="explanation-selection-methods">?</span></div>
    <div id="{{ rule_select_id }}" class="rule-select">
      {% for rule in article.computed_rules %}
        <div data-value="{{ rule.short_name }}" class="rule-select-option{% if rule == default_rule %} selected{% endif %}"><span>{{ rule.long_name }}</span></div>
      {% endfor %}
    </div>
  </div>

  <div class="representative-comments-analysis">
    <div class="comment-analysis-measure-block">
      <div class="comment-analysis-measure-header">Popularity <span class="open-explanation" data-target="explanation-popularity">?</span></div>
      <div class="progress-bar-wrap">
        <div class="comment-analysis-measure progress-bar satisfaction-progress">
          <div class="progress-bar-fill satisfaction-bar-fill">
            <span class="current-satisfaction-count"></span>
          </div>
        </div>
        <div class="progress-bar-details">
          <span>max. achievable is: </span><span class="max-satisfaction"></span>
        </div>
      </div>
    </div>

    <div class="comment-analysis-measure-block">
      <div class="comment-analysis-measure-header">Inclusion <span class="open-explanation" data-target="explanation-inclusion">?</span></div>
      <div class="progress-bar-wrap">
        <div class="comment-analysis-measure progress-bar coverage-progress">
          <div class="progress-bar-fill max-coverage-bar-fill"></div>
          <div class="progress-bar-fill coverage-bar-fill">
            <span class="current-coverage"></span>
          </div>
        </div>
        <div class="progress-bar-details">
          <span>max. achievable is: </span><span class="max-coverage"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- <div class="comment-analysis-measure-block" style="flex-direction: column;">
    <div class="comment-analysis-measure-header">Satisfaction Distribution <span class="open-explanation" data-target="explanation-satisfaction">?</span></div>
    <div class="satisfaction-histogram"></div>
  </div> -->

  <div class="article-comments-list representative-comments-list" id="{{ comment_list_id }}">
    <!-- JS will populate this based on selections -->
  </div>
</div>
